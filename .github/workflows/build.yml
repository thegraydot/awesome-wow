name: Bundle README

on:
  push:
    branches:
      - main
    paths:
      - "sections/**"
      - "bundle.sh"

jobs:
  build:
    name: Bundle README.md
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle README.md
        run: ./bundle.sh

      - name: Commit updated README.md (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: rebuild README.md from sections" && git push)
